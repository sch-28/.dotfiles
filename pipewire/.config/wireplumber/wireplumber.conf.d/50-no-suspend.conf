# Never suspend ALSA sinks/sources: keeps the DAC clocked so the analog line
# stays driven instead of going dead between sounds.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
      { node.name = "~alsa_input.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
