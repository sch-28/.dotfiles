# Dux draws its logo for its own notifications and launcher entries, ignoring the icon
# theme. The assets are unpacked to %t/dms-shell/<hash>/ on every start and loaded lazily.
[Service]
ExecStartPost=/bin/sh -c 'for f in %t/dms-shell/*/assets/danklogonormal.svg %t/dms-shell/*/assets/danklogo2.svg; do [ -e "$$f" ] && chmod u+w "$$f" && cat %h/.config/dms/logo.svg > "$$f" && chmod a-w "$$f"; done; true'
